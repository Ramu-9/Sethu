version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: setu-postgres
    environment:
      POSTGRES_USER: setu_owner
      POSTGRES_PASSWORD: setu_owner_dev_password
      POSTGRES_DB: setu
    ports:
      - "5432:5432"
    volumes:
      - setu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U setu_owner -d setu"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  setu_pgdata:
